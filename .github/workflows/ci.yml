name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build and Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # WeatherPing uses no transactions, so a plain MongoDB is enough.
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Lint
        run: |
          npm run lint --prefix backend
          npm run lint --prefix frontend

      - name: Build the frontend
        run: npm run build --prefix frontend

      # CI's own backend/.env. make-env.js (run by e2e/prepare.js) copies it to .env.test with
      # weatherping_test, the weather APIs pointed at the local stub (e2e/mocks) and two new Ethereal
      # inboxes. Nothing here is a real secret, and Open-Meteo is never called.
      - name: Write backend/.env
        run: |
          cat > backend/.env <<EOF
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=warn
          MONGODB_URI=mongodb://127.0.0.1:27017/weatherping
          JWT_SECRET=$(openssl rand -base64 48)
          UNSUBSCRIBE_SECRET=$(openssl rand -base64 48)
          JOB_TRIGGER_SECRET=$(openssl rand -base64 48)
          FRONTEND_URL=http://localhost:5173
          OPEN_METEO_FORECAST_URL=http://127.0.0.1:8090/v1/forecast
          OPEN_METEO_AIR_QUALITY_URL=http://127.0.0.1:8090/v1/air-quality
          OPEN_METEO_GEOCODING_URL=http://127.0.0.1:8090/v1/search
          SMTP_HOST=smtp.ethereal.email
          SMTP_PORT=587
          SMTP_USER=replaced-by-make-env
          SMTP_PASS=replaced-by-make-env
          SMTP_FROM="WeatherPing <alerts@weatherping.test>"
          DEMO_MODE=true
          DEMO_PASSWORD=ci-demo-password-1
          EOF

      - name: Install Chromium
        run: npx --prefix e2e playwright install --with-deps chromium

      - name: Playwright (API, browser and evaluator)
        working-directory: e2e
        env:
          CI: 'true'
        run: npm test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  docker:
    name: Docker image starts and serves the app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t weatherping .
      - name: Run, seed the demo, check the page and the API
        run: |
          ENVS="-e PORT=4000 -e TRUST_PROXY=1 -e MONGODB_URI=mongodb://127.0.0.1:27017/weatherping_demo \
            -e JWT_SECRET=$(openssl rand -hex 32) -e UNSUBSCRIBE_SECRET=$(openssl rand -hex 32) -e JOB_TRIGGER_SECRET=$(openssl rand -hex 32) \
            -e FRONTEND_URL=http://127.0.0.1:4000 \
            -e OPEN_METEO_FORECAST_URL=https://api.open-meteo.com/v1/forecast \
            -e OPEN_METEO_AIR_QUALITY_URL=https://air-quality-api.open-meteo.com/v1/air-quality \
            -e OPEN_METEO_GEOCODING_URL=https://geocoding-api.open-meteo.com/v1/search \
            -e SMTP_HOST=smtp.ethereal.email -e SMTP_PORT=587 -e SMTP_USER=none -e SMTP_PASS=none -e SMTP_FROM=alerts@weatherping.test \
            -e DEMO_MODE=true -e DEMO_PASSWORD=ci-demo-password-1"
          docker run -d --name app --network host $ENVS weatherping
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:4000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:4000/api/health
          curl -fs http://127.0.0.1:4000/rules | grep -q '<div id="root">'
          docker run --rm --network host $ENVS weatherping npm run seed:demo
          curl -fs http://127.0.0.1:4000/api/demo | grep -q 'user@demo.weatherping.test'
      - name: Container log
        if: always()
        run: docker logs app || true
